<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Hot Sauce Guitar Kitchen">
  <defs>
    <linearGradient id="pep" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#e0492a"/>
      <stop offset="1" stop-color="#a8151c"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="#1c1512" stroke="#d9a441" stroke-width="3"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#d9a441" stroke-width="1" opacity=".45"/>
  <!-- pepper body doubling as a guitar box -->
  <path d="M60 34 c17 0 27 15 27 32 0 18-12 30-27 30 -15 0-27-12-27-30 0-17 10-32 27-32 Z" fill="url(#pep)"/>
  <!-- headstock stem -->
  <path d="M54 34 l0-16 12 0 0 16" fill="none" stroke="#4a7a35" stroke-width="6" stroke-linecap="round"/>
  <circle cx="49" cy="22" r="4" fill="#d9a441"/>
  <circle cx="71" cy="22" r="4" fill="#d9a441"/>
  <!-- strings across the pepper -->
  <line x1="52" y1="34" x2="52" y2="94" stroke="#f2e6d2" stroke-width="2" opacity=".85"/>
  <line x1="60" y1="34" x2="60" y2="96" stroke="#f2e6d2" stroke-width="2.4" opacity=".85"/>
  <line x1="68" y1="34" x2="68" y2="94" stroke="#f2e6d2" stroke-width="2.8" opacity=".85"/>
  <!-- bridge -->
  <rect x="46" y="76" width="28" height="6" rx="2" fill="#d9a441"/>
  <!-- sound hole -->
  <circle cx="60" cy="56" r="7" fill="#2a0f0c" opacity=".65"/>
</svg>
